name: Update homepage option count
on:
  push:
    paths:
      - '.github/workflows/update-home-count.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update count
        run: sed -i 's/92 researched Dubai options/106 researched Dubai options/g' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update homepage venue count'
          git push
